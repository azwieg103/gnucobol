name: Build AlmaLinux 10 RPM

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync official GnuCOBOL source"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "upstream/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/build-rpm.yml"

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    steps:
      - name: Install build requirements
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install \
            gcc gcc-c++ make autoconf automake libtool bison \
            gettext-devel ncurses-devel gmp-devel \
            pkgconf-pkg-config rpm-build rpmdevtools git \
            tar gzip findutils sed grep help2man
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and test RPM
        if: hashFiles('upstream/configure.ac') != ''
        run: |
          chmod +x scripts/build-rpm.sh
          ./scripts/build-rpm.sh

      - name: Upload RPM artifacts
        if: hashFiles('upstream/configure.ac') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gnucobol-almalinux-10-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30
