name: Build AlmaLinux 10 RPM

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Sync official GnuCOBOL source"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "upstream/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/build-rpm.yml"
      - ".github/workflows/publish-release.yml"

# Serialize builds so each one calculates its rebuild number after the
# preceding build has completed and published (or failed).
concurrency:
  group: gnucobol-rpm-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: almalinux:10
    steps:
      - name: Install build requirements
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install \
            gcc gcc-c++ make autoconf automake libtool bison flex \
            gettext-devel ncurses-devel ncurses-term gmp-devel texinfo \
            pkgconf-pkg-config rpm-build rpmdevtools git python3 \
            tar gzip findutils sed grep help2man
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Select next ZWIEGNET rebuild number
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          with open("upstream/configure.ac", encoding="utf-8") as source:
              content = source.read()
          match = re.search(r"AC_INIT\\(\\[GnuCOBOL\\],\\s*\\[([^]]+)\\]", content)
          if not match:
              raise SystemExit("Could not determine the upstream GnuCOBOL version.")
          upstream_version = match.group(1)
          rpm_version = upstream_version.split("-", 1)[0]
          prefix = f"gnucobol-{rpm_version}-ZWIEGNET."
          token = os.environ["GH_TOKEN"]
          maximum = 0
          page = 1
          while True:
              url = f"https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page={page}"
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request) as response:
                  releases = json.load(response)
              if not releases:
                  break
              for release in releases:
                  tag = release.get("tag_name", "")
                  if tag.startswith(prefix):
                      suffix = tag[len(prefix):]
                      if suffix.isdigit():
                          maximum = max(maximum, int(suffix))
              if len(releases) < 100:
                  break
              page += 1
          rebuild = maximum + 1
          value = f"ZWIEGNET.{rebuild}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release={value}\\n")
          print(f"Upstream version: {upstream_version}")
          print(f"Selected RPM release: {rpm_version}-{value}")

      - name: Build and test RPM
        if: hashFiles('upstream/configure.ac') != ''
        env:
          RPM_RELEASE: ${{ steps.release.outputs.release }}
        run: |
          chmod +x scripts/build-rpm.sh
          ./scripts/build-rpm.sh

      - name: Upload test diagnostics
        if: always() && hashFiles('rpmbuild/BUILD/gnucobol/tests/testsuite.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gnucobol-test-diagnostics
          path: |
            rpmbuild/BUILD/gnucobol/tests/testsuite.log
            rpmbuild/BUILD/gnucobol/tests/testsuite.dir/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload RPM artifacts
        if: success() && hashFiles('upstream/configure.ac') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gnucobol-almalinux-10-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 30
