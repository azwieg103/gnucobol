name: Build and Publish AlmaLinux 10 RPM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "upstream/**"
      - "packaging/**"
      - "scripts/**"
      - ".github/workflows/build-rpm.yml"

# Serialize builds so rebuild numbers cannot race.
concurrency:
  group: gnucobol-rpm-build
  cancel-in-progress: false

# Default-deny: jobs must explicitly request additional permissions.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_current: ${{ steps.freshness.outputs.is_current }}
      rpm_version: ${{ steps.meta.outputs.version }}
    container:
      image: almalinux:10
    steps:
      - name: Install build requirements
        run: |
          dnf -y install dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install \
            gcc gcc-c++ make autoconf automake libtool bison flex \
            gettext-devel ncurses-devel ncurses-term gmp-devel texinfo \
            pkgconf-pkg-config rpm-build rpmdevtools git python3 \
            tar gzip findutils sed grep help2man
          dnf clean all

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select next ZWIEGNET rebuild number
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          with open("upstream/configure.ac", encoding="utf-8") as source:
              content = source.read()
          match = re.search(r"AC_INIT\(\[GnuCOBOL\],\s*\[([^]]+)\]", content)
          if not match:
              raise SystemExit("Could not determine the upstream GnuCOBOL version.")
          upstream_version = match.group(1)
          rpm_version = upstream_version.split("-", 1)[0]
          prefix = f"gnucobol-{rpm_version}-ZWIEGNET."
          token = os.environ["GH_TOKEN"]
          maximum = 0
          page = 1
          while True:
              url = f"https://api.github.com/repos/${{ github.repository }}/releases?per_page=100&page={page}"
              request = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(request) as response:
                  releases = json.load(response)
              if not releases:
                  break
              for release in releases:
                  tag = release.get("tag_name", "")
                  if tag.startswith(prefix):
                      suffix = tag[len(prefix):]
                      number = re.fullmatch(r"([1-9][0-9]*)(?:\\.el10)?", suffix)
                      if number:
                          maximum = max(maximum, int(number.group(1)))
              if len(releases) < 100:
                  break
              page += 1
          rebuild = maximum + 1
          value = f"ZWIEGNET.{rebuild}.el10"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release={value}\n")
          print(f"Upstream version: {upstream_version}")
          print(f"Selected RPM release: {rpm_version}-{value}")
          PY

      - name: Build and test RPM
        run: |
          chmod +x scripts/build-rpm.sh
          ./scripts/build-rpm.sh
        env:
          RPM_RELEASE: ${{ steps.release.outputs.release }}

      - name: Upload test diagnostics
        if: always() && hashFiles('rpmbuild/BUILD/gnucobol/tests/testsuite.log') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gnucobol-test-diagnostics
          path: |
            rpmbuild/BUILD/gnucobol/tests/testsuite.log
            rpmbuild/BUILD/gnucobol/tests/testsuite.dir/**
          if-no-files-found: warn
          retention-days: 14

      - name: Confirm this is still the latest main build
        if: success()
        id: freshness
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main"
            });
            const isCurrent = ref.data.object.sha === context.sha;
            core.setOutput("is_current", String(isCurrent));
            if (!isCurrent) core.info("Not publishing an RPM from an outdated build.");

      - name: Determine RPM release metadata
        if: steps.freshness.outputs.is_current == 'true'
        id: meta
        run: |
          rpm_file=$(find dist -maxdepth 1 -type f -name 'gnucobol-[0-9]*.el10.x86_64.rpm' ! -name '*debuginfo*' ! -name '*debugsource*' | head -n1)
          test -n "$rpm_file"
          version=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm_file")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          rpm -qp --qf 'RPM: %{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm_file"

      - name: Upload RPM artifacts
        if: success() && steps.freshness.outputs.is_current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gnucobol-almalinux-10-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: needs.build.outputs.is_current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download RPM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gnucobol-almalinux-10-x86_64
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          RPM_VERSION: ${{ needs.build.outputs.rpm_version }}
        run: |
          set -euo pipefail
          version="$RPM_VERSION"
          tag="gnucobol-$version"
          title="GnuCOBOL $version (Enterprise Linux 10)"
          notes=$(cat <<'EOF'
          Rebuilt GnuCOBOL packages for Enterprise Linux 10 (x86_64), intended for AlmaLinux 10, Red Hat Enterprise Linux 10, Oracle Linux 10, Rocky Linux 10, and CentOS Stream 10.

          Rebuilt from the source snapshot checked into this GitHub repository, synchronized from the official GnuCOBOL 3.x upstream branch.

          The RPM version follows upstream. The ZWIEGNET rebuild number increments for each published build of the same upstream version. These packages are supplied as-is, with no warranty or support. They are built on AlmaLinux 10 and are not individually tested on every Enterprise Linux distribution.

          Includes binary RPMs and the source RPM. Publication occurs only after the build and upstream test suite succeed.
          EOF
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite published artifacts."
            exit 1
          fi
          gh release create "$tag" dist/*.rpm \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "$notes" \
            --latest
