name: Publish RPM Release

on:
  workflow_run:
    workflows: ["Build AlmaLinux 10 RPM"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download RPM artifacts from successful build
        uses: actions/download-artifact@v4
        with:
          name: gnucobol-almalinux-10-x86_64
          path: release
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install RPM tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Determine RPM version
        id: meta
        run: |
          rpm_file=$(find release -maxdepth 1 -type f -name 'gnucobol-[0-9]*.x86_64.rpm' ! -name '*debuginfo*' ! -name '*debugsource*' | head -n1)
          test -n "$rpm_file"
          version=$(rpm -qp --qf '%{VERSION}-%{RELEASE}' "$rpm_file")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "rpm_file=$rpm_file" >> "$GITHUB_OUTPUT"
          rpm -qp --qf 'RPM: %{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n' "$rpm_file"

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gnucobol-${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: GnuCOBOL ${{ steps.meta.outputs.version }} (Enterprise Linux 10)
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release/*.rpm
          body: |
            Rebuilt GnuCOBOL packages for Enterprise Linux 10 (x86_64), intended for AlmaLinux 10, Red Hat Enterprise Linux 10, Oracle Linux 10, Rocky Linux 10, and CentOS Stream 10.

            Rebuilt from the source snapshot checked into this GitHub repository, synchronized from the official GnuCOBOL 3.x upstream branch.

            Upstream development suffixes are omitted from the RPM release identifier. These packages are supplied as-is, with no warranty or support. They are built on AlmaLinux 10 and are not individually tested on every Enterprise Linux distribution.

            Includes binary RPMs and the source RPM. Publication occurs only after the build and upstream test suite succeed.

            Build workflow: ${{ github.event.workflow_run.html_url }}
